[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprf"
version = "3.0.0"
description = "A free & open source python tool for population receptive field analysis of fMRI data."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ingo Marquardt", email = "ingo.marquardt@gmx.de" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nibabel>=5.0",
    "pillow>=10.0",
    "h5py>=3.10",
]
keywords = ["pRF", "fMRI", "retinotopy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
pyprf = "pyprf.analysis.__main__:main"

[project.urls]
Homepage = "https://github.com/ingo-m/pyprf"
Issues = "https://github.com/ingo-m/pyprf/issues"
DOI = "https://doi.org/10.5281/zenodo.1475439"

[tool.setuptools]
packages = ["pyprf", "pyprf.analysis"]

[tool.setuptools.exclude-package-data]
"pyprf.analysis" = ["*.pyx", "*.c"]

[tool.pytest.ini_options]
testpaths = ["pyprf/analysis", "tests"]

[tool.coverage.run]
source = ["pyprf"]
omit = ["*__init__*", "*__main__*"]
# The pRF analysis runs in parallel processes (multiprocessing) and threads.
concurrency = ["multiprocessing", "thread"]
parallel = true

[tool.cibuildwheel]
# Wheels for CPython 3.15 can be added once scipy & h5py provide wheels for it.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
# Run the test suite on each wheel. The tests are run against the installed
# wheel (not the source directory), hence `--import-mode=importlib`.
test-extras = ["test"]
test-command = "pytest {project}/pyprf/analysis --import-mode=importlib -p no:cacheprovider"
